<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211c28">
  <title>Stellan Oli Oli — Fan Desk</title>
  <link rel="icon" href="../app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./home.css">
  <script defer src="../config.js"></script>
  <script defer src="./renderer.bundle.js"></script>
</head>
<body>
  <div class="boot-screen" id="bootScreen" aria-label="Opening your fan space">
    <div class="boot-record"><span>SO</span></div>
    <p>SETTING THE SCENE</p>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" type="button" data-page="home" aria-label="Stellan Oli Oli home">
        <span class="brand-mark">S</span>
        <span class="brand-copy">stellan <strong>oli oli</strong><small>THE DESKTOP EDITION</small></span>
        <span class="brand-sticker" aria-hidden="true">✳</span>
      </button>

      <nav class="side-nav" aria-label="Main navigation">
        <p class="nav-label">THE FRONT ROW</p>
        <button class="nav-item active" type="button" data-page="home"><span class="nav-icon">⌂</span><span>Home</span><span class="nav-index">01</span></button>
        <button class="nav-item" type="button" data-page="eras"><span class="nav-icon">◉</span><span>Album eras</span><span class="nav-index">02</span></button>
        <button class="nav-item" type="button" data-page="discovery"><span class="nav-icon">✧</span><span>Mood & era quiz</span><span class="nav-index">03</span></button>
        <button class="nav-item" type="button" data-page="oliclips"><span class="nav-icon">▷</span><span>Oliclips</span><span class="nav-index">04</span></button>
        <button class="nav-item" type="button" data-page="gallery"><span class="nav-icon">▧</span><span>Photo diary</span><span class="nav-index">05</span></button>
        <button class="nav-item" type="button" data-page="tour"><span class="nav-icon">✦</span><span>Live dates</span><span class="nav-index">06</span></button>

        <p class="nav-label nav-label-space">YOUR LITTLE CORNER</p>
        <button class="nav-item" type="button" data-page="music"><span class="nav-icon">♫</span><span>Your library</span></button>
        <button class="nav-item" type="button" data-page="community"><span class="nav-icon">✳</span><span>Fan circle</span></button>
        <button class="nav-item" type="button" data-page="messages"><span class="nav-icon">♡</span><span>Messages</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-orbit" aria-hidden="true"><span>✦</span><i></i><b></b></div>
        <p class="sidebar-note">for the songs that<br><em>get you.</em></p>
        <button class="profile-chip" type="button" data-page="profile">
          <span class="profile-avatar" id="sidebarAvatar">S</span>
          <span class="profile-chip-copy"><strong id="sidebarName">Your fan space</strong><small id="sidebarStatus">Sign in to sync</small></span>
          <span class="profile-chevron">↗</span>
        </button>
        <button class="settings-link" type="button" data-page="settings"><span>⚙</span> Settings <span class="settings-version" id="appVersion">DESKTOP</span></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>STELLAN OLI OLI</span><b>/</b><strong id="pageCrumb">YOUR FAN DESK</strong></div>
        <div class="topbar-actions">
          <label class="search-wrap" for="globalSearch"><span>⌕</span><input id="globalSearch" type="search" placeholder="Find a song, era, or feeling…" autocomplete="off"><kbd>Ctrl K</kbd></label>
          <button class="top-profile" type="button" data-page="profile" aria-label="Open your profile"><span id="topAvatar">S</span></button>
        </div>
        <div class="search-results" id="searchResults" hidden></div>
      </header>
      <div class="content-scroll" id="contentScroll">
        <div class="page-host" id="pageHost" tabindex="-1"></div>
        <footer class="app-footer"><span>MADE FOR THE FANS, WITH A LITTLE EXTRA HEART <b>♥</b></span><button type="button" data-action="visit-site">VISIT THE FAN SITE ↗</button></footer>
        <p class="app-status" id="appStatus" role="status" aria-live="polite"></p>
      </div>
    </main>
  </div>
</body>
</html>

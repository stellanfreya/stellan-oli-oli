<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stellan Oli Oli — connection needed</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background: #f5f4f1; color: #211b1c; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(460px, 100%); padding: 44px; border: 1px solid #211b1c24; border-radius: 20px; background: #fffdfa; box-shadow: 0 24px 80px #211b1c14; }
    .mark { display: grid; width: 56px; height: 56px; place-items: center; border-radius: 17px; background: #9c4353; color: white; font: 700 28px Georgia, serif; }
    p { color: #62595a; line-height: 1.65; }
    button { margin-top: 12px; padding: 13px 20px; border: 0; border-radius: 999px; background: #211b1c; color: white; cursor: pointer; font: 600 13px "Segoe UI", sans-serif; }
    button:hover { background: #9c4353; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>One sec, fan.</h1>
    <p>Stellan Oli Oli needs an internet connection to open the fan site. Check your connection, then try again.</p>
    <button type="button" onclick="location.replace('https://stellanfreya.github.io/stellan-oli-oli/')">Try again</button>
  </main>
</body>
</html>
